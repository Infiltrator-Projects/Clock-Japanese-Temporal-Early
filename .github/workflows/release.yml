name: Qualify and publish native clock resource
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils pkg-config libglib2.0-dev libicu-dev jq ghostscript zip
      - name: Forbid Python source and validate native artefacts
        shell: bash
        run: |
          set -euo pipefail
          if find . -name '*.py' -not -path './common/*' | grep -q .; then echo 'Python code prohibited in clocks' >&2; exit 1; fi
          bash common/clock-tools/build.sh release
          deb=(dist/*.deb)
          bash common/clock-tools/check-package.sh "${deb[0]}" portable
          sudo bash common/clock-tools/check-upgrade.sh "${deb[0]}"
          run=(dist/*.run)
          "$(realpath "${run[0]}")" --help
          sudo "$(realpath "${run[0]}")" --profile aggressive --system-package-mode
          package=$(jq -r '"infiltrator-" + (.repository | ascii_downcase)' SOURCE-MANIFEST.json)
          test "$(dpkg-query -W -f='${Status}' "$package")" = 'install ok installed'
          test "$(dpkg-query -W -f='${Version}' "$package")" = "$(cat VERSION)+native1"
          name=$(jq -r '.name' SOURCE-MANIFEST.json)
          repo=$(jq -r '.repository' SOURCE-MANIFEST.json)
          test -f "/System/Resources/Clocks/$name.so"
          test -f "/System/Resources/Documentation/$repo/$name.pdf"
          test "$(dpkg-query -W -f='${X-Infiltrator-PGO}' "$package")" = 'trained-two-pass'
          test "$(dpkg-query -W -f='${X-Infiltrator-Resource-SHA256}' "$package")" = "$(sha256sum "/System/Resources/Clocks/$name.so" | cut -d' ' -f1)"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          jq -n --arg sha "$GITHUB_SHA" --arg version "$(cat VERSION)" --arg name "$name" --slurpfile assets <(for f in dist/*.deb dist/*.run dist/*.zip; do jq -n --arg file "$(basename "$f")" --arg hash "$(sha256sum "$f" | cut -d' ' -f1)" '{($file):$hash}'; done | jq -s 'add') \
            '{commit:$sha,version:$version,name:$name,assets:$assets[0]}' > dist/contract.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: qualify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: provider-qualified-${{ github.sha }}
          path: release
      - name: Publish qualified artifacts without Python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash common/clock-tools/publish.sh
